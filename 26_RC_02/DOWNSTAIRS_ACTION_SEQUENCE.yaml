# R2 downstairs action sequence
#
# Source export:
#   PC_USB_Serial_Tool/downstairs_v01.json
# Compression:
#   Consecutive identical debug actions are merged into one firmware step.
#   Non-contiguous matching actions are kept in execution order.
#
# Source actions: 69
# Firmware states after compression: 14
#
# Note:
#   The source file used 3s for DRIVE_BACKWARD_500 actions. Firmware timeouts
#   below are recalculated from the configured drive speed instead of reusing
#   that short manual timeout.

version: 1
source_flow: downstairs_v01
source_step_count: 69
firmware_step_count: 14
compression:
  merge_consecutive_identical_actions: true
  drive_timeout_speed_mm_s: 80.0
  drive_timeout_margin_ms: 1500
execution_mode: compressed_downstairs_blocks

debug_sequence:
  - index: 1
    state: DOWN_01_REAR_UP_200
    action: REAR_UP_10
    compressed_repeats: 20
    timeout_ms: 9000
    expected_leg_target_mm: [-10.0, 190.0, 190.0, -10.0]
    source_index_range: [1, 20]

  - index: 2
    state: DOWN_02_FRONT_UP_10
    action: FRONT_UP_10
    compressed_repeats: 1
    timeout_ms: 3000
    expected_leg_target_mm: [0.0, 190.0, 190.0, 0.0]
    source_index: 21

  - index: 3
    state: DOWN_03_ALL_LEGS_UP_10
    action: ALL_LEGS_UP_10
    compressed_repeats: 1
    timeout_ms: 3000
    expected_leg_target_mm: [10.0, 200.0, 200.0, 10.0]
    source_index: 22

  - index: 4
    state: DOWN_04_FRONT_UP_10
    action: FRONT_UP_10
    compressed_repeats: 1
    timeout_ms: 3000
    expected_leg_target_mm: [20.0, 200.0, 200.0, 20.0]
    source_index: 23

  - index: 5
    state: DOWN_05_ALL_LEGS_UP_10
    action: ALL_LEGS_UP_10
    compressed_repeats: 1
    timeout_ms: 3000
    expected_leg_target_mm: [30.0, 210.0, 210.0, 30.0]
    source_index: 24

  - index: 6
    state: DOWN_06_DRIVE_BACKWARD_1500
    action: DRIVE_BACKWARD_500
    compressed_repeats: 3
    timeout_ms: 20250
    expected_leg_target_mm: [30.0, 210.0, 210.0, 30.0]
    source_index_range: [25, 27]
    drive_delta_mm: -1500.0

  - index: 7
    state: DOWN_07_DRIVE_BACKWARD_300
    action: DRIVE_BACKWARD_30
    compressed_repeats: 10
    timeout_ms: 5250
    expected_leg_target_mm: [30.0, 210.0, 210.0, 30.0]
    source_index_range: [28, 37]
    drive_delta_mm: -300.0

  - index: 8
    state: DOWN_08_ALL_LEGS_DOWN_40
    action: ALL_LEGS_DOWN_10
    compressed_repeats: 4
    timeout_ms: 5000
    expected_leg_target_mm: [-10.0, 170.0, 170.0, -10.0]
    source_index_range: [38, 41]

  - index: 9
    state: DOWN_09_FRONT_DOWN_10
    action: FRONT_DOWN_10
    compressed_repeats: 1
    timeout_ms: 3000
    expected_leg_target_mm: [-10.0, 170.0, 170.0, -10.0]
    source_index: 42

  - index: 10
    state: DOWN_10_DRIVE_BACKWARD_120
    action: DRIVE_BACKWARD_30
    compressed_repeats: 4
    timeout_ms: 3000
    expected_leg_target_mm: [-10.0, 170.0, 170.0, -10.0]
    source_index_range: [43, 46]
    drive_delta_mm: -120.0

  - index: 11
    state: DOWN_11_FRONT_UP_200
    action: FRONT_UP_10
    compressed_repeats: 20
    timeout_ms: 9000
    expected_leg_target_mm: [190.0, 170.0, 170.0, 190.0]
    source_index_range: [47, 66]

  - index: 12
    state: DOWN_12_DRIVE_BACKWARD_500
    action: DRIVE_BACKWARD_500
    compressed_repeats: 1
    timeout_ms: 7750
    expected_leg_target_mm: [190.0, 170.0, 170.0, 190.0]
    source_index: 67
    drive_delta_mm: -500.0

  - index: 13
    state: DOWN_13_ALL_LEGS_ZERO
    action: ALL_LEGS_ZERO
    compressed_repeats: 1
    timeout_ms: 9000
    expected_leg_target_mm: [0.0, 0.0, 0.0, 0.0]
    source_index: 68

  - index: 14
    state: DOWN_14_ALL_LEGS_DOWN_10
    action: ALL_LEGS_DOWN_10
    compressed_repeats: 1
    timeout_ms: 3000
    expected_leg_target_mm: [-10.0, -10.0, -10.0, -10.0]
    source_index: 69
