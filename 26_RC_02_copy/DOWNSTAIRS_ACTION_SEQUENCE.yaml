# R2 downstairs action sequence
#
# Source export:
#   PC_USB_Serial_Tool/downstairs_v4.json
# Compression:
#   Consecutive identical debug actions are merged into one firmware step.
#   Drive and chassis repeat blocks use summed relative deltas.
#   Leg repeat blocks use their final absolute targets.
#
# Source actions: 79
# Primitive actions used by firmware input: 79
# Firmware states after compression: 15

version: 2
source_flow: downstairs_v4
source_step_count: 79
primitive_step_count: 79
firmware_step_count: 15
compression:
  merge_consecutive_identical_actions: true
  drive_timeout_speed_mm_s: 80.0
  drive_timeout_margin_ms: 1500
execution_mode: compressed_downstairs_v4_blocks

