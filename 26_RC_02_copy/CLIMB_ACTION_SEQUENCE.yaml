# R2 upstairs action sequence
#
# Source export:
#   PC_USB_Serial_Tool/upstairs_v4.json
# Compression:
#   Consecutive identical debug actions are merged into one firmware step.
#   Drive and chassis repeat blocks use summed relative deltas.
#   Leg repeat blocks use their final absolute targets.
#
# Source actions: 40
# Primitive actions used by firmware input: 40
# Firmware states after compression: 13

version: 3
source_flow: upstairs_v4
source_step_count: 40
primitive_step_count: 40
firmware_step_count: 13
compression:
  merge_consecutive_identical_actions: true
  drive_timeout_speed_mm_s: 80.0
  drive_timeout_margin_ms: 1500
execution_mode: compressed_upstairs_v4_blocks

debug_sequence:
  - index: 1
    state: STEP_01_ALL_LEGS_220
    action: ALL_LEGS_220
    compressed_repeats: 1
    timeout_ms: 9500
    expected_leg_target_mm: [220.0, 220.0, 220.0, 220.0]
    drive_group: all
    source_index: 1

  - index: 2
    state: STEP_02_ALL_DRIVE_FORWARD_30_X3
