<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#2f80ed"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#21a67a"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#e15b5b"/>
    </marker>
    <marker id="arrowDark" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.2; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #14213d; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #51606f; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #25313f; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #526171; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 12px; fill: #657181; }
      .code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; fill: #263238; }
      .axisZ { stroke: #2f80ed; }
      .axisY { stroke: #21a67a; }
      .axisX { stroke: #e15b5b; }
      .link { fill: none; stroke: #f0a23a; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .linkCore { fill: none; stroke: #8a5a12; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .chord { fill: none; stroke: #9aa9b8; stroke-width: 2; stroke-dasharray: 8 7; }
      .construction { fill: none; stroke: #b8c3cf; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .ground { fill: none; stroke: #7b8794; stroke-width: 2; stroke-dasharray: 10 8; }
      .joint { fill: #ffffff; stroke: #14213d; stroke-width: 3; }
      .jointFill { fill: #14213d; }
      .callout { fill: #ffffff; stroke: #cad4df; stroke-width: 1; }
      .warn { fill: #fff8ec; stroke: #f0c36d; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="900"/>

  <text class="title" x="48" y="55">实际机械臂电机零位 - J0 的 OYZ 侧视图</text>
  <text class="subtitle" x="48" y="82">视角约定：横向为 Y0，竖向为 Z0，+X0 指向屏幕外。图中按“长段连杆朝 -Y0 且相对 XOY 平面下倾 6°”绘制，J2-J3 主弦仅作参考。</text>

  <rect class="panel" x="40" y="112" width="880" height="735" rx="8"/>
  <rect class="panel" x="946" y="112" width="294" height="735" rx="8"/>

  <!-- Main coordinate axes -->
  <line x1="116" y1="786" x2="276" y2="786" class="axisY" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="116" y1="786" x2="116" y2="626" class="axisZ" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <circle cx="116" cy="786" r="18" fill="#ffffff" stroke="#e15b5b" stroke-width="3"/>
  <circle cx="116" cy="786" r="5" fill="#e15b5b"/>
  <text class="label" x="285" y="792" fill="#21a67a">+Y0</text>
  <text class="label" x="101" y="615" fill="#2f80ed">+Z0</text>
  <text class="label" x="142" y="791" fill="#e15b5b">+X0 出屏</text>
  <text class="tiny" x="86" y="816">OYZ plane</text>

  <!-- Ground and construction lines -->
  <line x1="250" y1="690" x2="900" y2="690" class="ground"/>
  <text class="small" x="258" y="713">XOY 平面，Z0 = 0</text>
  <line x1="285" y1="572.184" x2="895" y2="572.184" class="construction"/>
  <text class="small" x="660" y="559">过 J2 且平行于 XOY 平面的参考线</text>

  <!-- Base and joint locations, screen transform: sx=780+1.2Y, sy=690-1.2Z -->
  <line x1="780" y1="690" x2="780" y2="572.184" stroke="#6b7785" stroke-width="8" stroke-linecap="round"/>
  <line x1="780" y1="572.184" x2="831.168" y2="572.184" stroke="#6b7785" stroke-width="8" stroke-linecap="round"/>

  <!-- Convex link J2 -> vertex -> J3 -->
  <path d="M 831.168 572.184 L 507.772 606.174 L 371.234 545.383" class="link"/>
  <path d="M 831.168 572.184 L 507.772 606.174 L 371.234 545.383" class="linkCore"/>
  <path d="M 831.168 572.184 L 371.234 545.383" class="chord"/>

  <!-- Joints -->
  <circle cx="780" cy="690" r="12" class="joint"/>
  <circle cx="780" cy="572.184" r="10" class="joint"/>
  <circle cx="831.168" cy="572.184" r="14" class="joint"/>
  <circle cx="507.772" cy="606.174" r="8" fill="#fff1d0" stroke="#8a5a12" stroke-width="2"/>
  <circle cx="371.234" cy="545.383" r="14" class="joint"/>

  <text class="label" x="795" y="693">J1 / O0</text>
  <text class="small" x="793" y="717">(0, 0, 0)</text>
  <text class="label" x="640" y="534">O1_mdh</text>
  <text class="small" x="626" y="515">(0, 0, 98.18)</text>
  <text class="label" x="846" y="536">J2 / O2</text>
  <text class="small" x="846" y="557">(0, 42.64, 98.18)</text>
  <text class="label" x="205" y="572">J3 = J4</text>
  <text class="small" x="176" y="594">(0, -340.64, 120.51)</text>
  <text class="small" x="464" y="642">凹型折点</text>
  <text class="tiny" x="450" y="660">(0, -226.86, 69.85)</text>

  <!-- 6 degree angle marker near J2 -->
  <line x1="831.168" y1="572.184" x2="742" y2="572.184" stroke="#7b8794" stroke-width="1.7"/>
  <path d="M 751.168 572.184 A 80 80 0 0 1 751.606 580.546" fill="none" stroke="#263238" stroke-width="2"/>
  <text class="label" x="706" y="592">长段下倾 6°</text>
  <text class="small" x="430" y="524">J2-J3 主弦约 383.93 mm；不是 6° 标定线</text>
  <text class="tiny" x="548" y="630">长段 270.980762 mm</text>
  <text class="tiny" x="322" y="520">短段 124.55 mm</text>
  <text class="tiny" x="516" y="588">包含角 150°</text>

  <!-- Motor shaft direction symbols -->
  <line x1="780" y1="690" x2="780" y2="628" class="axisZ" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="small" x="660" y="646">J1 输出轴 +Z0</text>
  <text class="tiny" x="660" y="666">输出轴:实际转轴 = 1:1</text>

  <circle cx="856" cy="650" r="17" fill="#fff" stroke="#e15b5b" stroke-width="3"/>
  <line x1="844" y1="638" x2="868" y2="662" stroke="#e15b5b" stroke-width="3"/>
  <line x1="868" y1="638" x2="844" y2="662" stroke="#e15b5b" stroke-width="3"/>
  <text class="small" x="806" y="628">J2 -X0 入屏</text>
  <text class="tiny" x="810" y="646">30:55</text>

  <circle cx="371.234" cy="428" r="17" fill="#fff" stroke="#e15b5b" stroke-width="3"/>
  <circle cx="371.234" cy="428" r="5" fill="#e15b5b"/>
  <text class="small" x="395" y="421">J3 电机输出轴 +X0 出屏</text>
  <text class="tiny" x="395" y="441">输出轴:实际关节 = 1:2</text>

  <!-- Actual J4 frame at power-on -->
  <line x1="371.234" y1="545.383" x2="371.234" y2="617.383" class="axisZ" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="371.234" y1="545.383" x2="301.234" y2="545.383" class="axisY" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <circle cx="347.234" cy="571.383" r="15" fill="#fff" stroke="#e15b5b" stroke-width="3"/>
  <circle cx="347.234" cy="571.383" r="4.5" fill="#e15b5b"/>
  <text class="small" x="388" y="626">+Z4 = -Z0，竖直向下</text>
  <text class="tiny" x="226" y="535">+Y4 取 -Y0</text>
  <text class="tiny" x="304" y="602">+X4 出屏</text>

  <!-- Difference callout -->
  <rect class="warn" x="70" y="135" width="360" height="86" rx="7"/>
  <text class="label" x="90" y="164">注意：这是实际电机零位</text>
  <text class="small" x="90" y="188">落在 -Y0 半轴时，连杆在侧视图中呈凹型。</text>
  <text class="small" x="90" y="209">6° 属于长段下倾角，不是 J2-J3 主弦角。</text>

  <!-- Side notes -->
  <text class="label" x="976" y="152">上电初始几何</text>
  <line x1="976" y1="164" x2="1210" y2="164" stroke="#d5dde7"/>
  <text class="code" x="976" y="196">J1 = (0, 0, 0)</text>
  <text class="code" x="976" y="222">O1 = (0, 0, 98.18)</text>
  <text class="code" x="976" y="248">J2 = (0, 42.64, 98.18)</text>
  <text class="code" x="976" y="274">J3 = J4</text>
  <text class="code" x="976" y="300">   = (0, -340.64, 120.51)</text>
  <text class="small" x="976" y="331">长段连杆朝 -Y0 且低于水平参考。</text>
  <text class="small" x="976" y="353">长段与 XOY 平面夹角：-6°。</text>
  <text class="small" x="976" y="375">J2-J3 主弦不是 6° 标定对象。</text>

  <text class="label" x="976" y="405">电机输出轴与比例</text>
  <line x1="976" y1="417" x2="1210" y2="417" stroke="#d5dde7"/>
  <text class="small" x="976" y="448">J1：输出轴 +Z0，1:1。</text>
  <text class="small" x="976" y="476">J2：输出轴 -X0，30:55。</text>
  <text class="small" x="976" y="504">J3：输出轴 +X0，1:2。</text>
  <text class="tiny" x="976" y="534">比例文字按“电机输出轴:实际关节”保留。</text>

  <text class="label" x="976" y="586">J4 坐标系</text>
  <line x1="976" y1="598" x2="1210" y2="598" stroke="#d5dde7"/>
  <text class="small" x="976" y="630">实际上电：+Z4 竖直向下。</text>
  <text class="small" x="976" y="656">为保持右手系，本图取：</text>
  <text class="code" x="976" y="684">+X4 = +X0</text>
  <text class="code" x="976" y="710">+Y4 = -Y0</text>
  <text class="code" x="976" y="736">+Z4 = -Z0</text>

  <text class="tiny" x="976" y="800">绘图比例：1.2 px/mm；侧视图只显示 Y/Z。</text>
</svg>
